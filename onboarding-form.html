<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start onboarding | Swift Agencies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #17211f; --muted: #66716d; --paper: #f4f1e8; --cream: #fffdf7; --lime: #d8f36b; --coral: #f2785c; --line: #d9ded5; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "DM Sans", sans-serif; }
    main { max-width: 720px; margin: auto; padding: 70px 24px; }
    a { color: var(--ink); }
    .back { font-size: .9rem; }
    .kicker { margin-top: 70px; color: var(--coral); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 15px 0; font: 600 clamp(3rem, 8vw, 5.6rem)/.94 "Space Grotesk", sans-serif; letter-spacing: -.06em; }
    p { color: var(--muted); line-height: 1.6; }
    form { display: grid; gap: 18px; margin-top: 42px; padding: 30px; background: var(--cream); border-top: 2px solid var(--ink); }
    label { display: grid; gap: 8px; font-size: .9rem; font-weight: 700; }
    input, textarea { width: 100%; padding: 13px; border: 1px solid var(--line); color: var(--ink); background: white; font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button { width: fit-content; padding: 16px 20px; border: 2px solid var(--ink); color: var(--cream); background: var(--ink); font: 700 1rem "DM Sans", sans-serif; cursor: pointer; }
    button:hover, button:focus-visible { color: var(--ink); background: var(--lime); }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&#8592; Back to the offer</a>
    <div class="kicker">Let's get moving</div>
    <h1>Start your onboarding.</h1>
    <p>Tell us a little about where you are and where you want to go. We will be in touch with the next step.</p>
    <form action="https://tally.so" method="get">
      <label>Name <input name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Business / website <input name="business"></label>
      <label>What are you looking to build? <textarea name="goals"></textarea></label>
      <button type="submit">Send onboarding details &#8599;</button>
    </form>
  </main>
</body>
</html>
